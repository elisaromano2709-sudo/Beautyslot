<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautyslot · Conferma account</title>
  <meta name="robots" content="noindex,nofollow">

  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#f7ecec;
      --card:#ffffff;
      --accent:#9d6870;
      --text:#765f64;
      --muted:#9b858a;
      --border:#ead8db;
    }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:var(--bg);
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
    }
    .card{
      width:min(520px,100%);
      padding:44px 30px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:26px;
      text-align:center;
      box-shadow:0 18px 50px rgba(120,86,93,.08);
    }
    .brand{
      font-family:Georgia,"Times New Roman",serif;
      font-size:35px;
      font-weight:400;
      color:var(--accent);
    }
    .tag{
      margin-top:7px;
      font-size:9px;
      letter-spacing:2.8px;
      text-transform:uppercase;
      color:var(--muted);
    }
    h1{
      margin:34px 0 13px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:28px;
      font-weight:400;
      color:var(--accent);
    }
    p{
      margin:0 auto;
      max-width:400px;
      font-size:14px;
      line-height:1.65;
      color:var(--muted);
    }
    .loader{
      width:35px;
      height:35px;
      margin:28px auto 0;
      border:3px solid #efdfe1;
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    .error{
      display:none;
      margin-top:22px;
      padding:14px;
      border:1px solid #efd3d3;
      border-radius:14px;
      background:#fff7f7;
      color:#9a5555;
      font-size:13px;
      line-height:1.55;
    }
    .button{
      display:none;
      margin:18px auto 0;
      padding:13px 21px;
      border:0;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      cursor:pointer;
      font-size:12px;
      font-weight:600;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">Beautyslot</div>
    <div class="tag">Book beauty. Your way.</div>

    <h1 id="title">Conferma del tuo account</h1>
    <p id="message">Stiamo verificando la tua email e preparando il tuo accesso.</p>

    <div class="loader" id="loader"></div>
    <div class="error" id="errorBox"></div>

    <button class="button" id="loginButton" type="button">
      Vai all'accesso
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://kfhjydwgjtiyjdkedvrp.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_BueoI4fhTcQCdkaGnrtk9g_A0cJRkh7";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:false
        }
      }
    );

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const loader = document.getElementById("loader");
    const errorBox = document.getElementById("errorBox");
    const loginButton = document.getElementById("loginButton");

    function clearIdentity(){
      localStorage.removeItem("beautyslot_nome");
      localStorage.removeItem("beautyslot_cognome");
      localStorage.removeItem("beautyslot_full_name");
      localStorage.removeItem("beautyslot_user_id");
      localStorage.removeItem("beautyslot_email");
    }

    function saveIdentity(user){
      if(!user) return;

      clearIdentity();

      const metadata = user.user_metadata || {};

      let nome =
        metadata.nome ||
        (
          metadata.full_name
            ? metadata.full_name.trim().split(/\s+/)[0]
            : ""
        );

      if(!nome && user.email){
        const prefix = user.email.split("@")[0];
        const first =
          prefix.split(/[._-]/)[0].replace(/[^a-zA-ZÀ-ÿ]/g,"");

        if(first){
          nome =
            first.charAt(0).toUpperCase() +
            first.slice(1).toLowerCase();
        }
      }

      localStorage.setItem(
        "beautyslot_user_id",
        user.id || ""
      );

      localStorage.setItem(
        "beautyslot_email",
        user.email || ""
      );

      if(nome){
        localStorage.setItem(
          "beautyslot_nome",
          nome
        );
      }

      if(metadata.cognome){
        localStorage.setItem(
          "beautyslot_cognome",
          metadata.cognome
        );
      }

      if(metadata.full_name){
        localStorage.setItem(
          "beautyslot_full_name",
          metadata.full_name
        );
      }else if(nome){
        localStorage.setItem(
          "beautyslot_full_name",
          [nome, metadata.cognome || ""]
            .filter(Boolean)
            .join(" ")
        );
      }

      if(metadata.tipo_utente){
        sessionStorage.setItem(
          "beautyslot_tipo_utente",
          metadata.tipo_utente
        );
      }

      sessionStorage.removeItem(
        "beautyslot_pending_user_id"
      );

      sessionStorage.removeItem(
        "beautyslot_pending_email"
      );
    }

    function fail(text){
      loader.style.display = "none";
      title.textContent = "Conferma non completata";
      message.textContent =
        "Non è stato possibile creare automaticamente la sessione Beautyslot.";
      errorBox.textContent = text;
      errorBox.style.display = "block";
      loginButton.style.display = "inline-flex";
    }

    loginButton.addEventListener("click", () => {
      window.location.replace("login.html");
    });

    async function confirmAccount(){
      const params =
        new URLSearchParams(window.location.search);

      const tokenHash =
        params.get("token_hash");

      const type =
        params.get("type") || "email";

      let next =
        params.get("next") ||
        "scelta-trattamenti.html";

      try{
        const nextUrl =
          new URL(next, window.location.origin);

        if(nextUrl.origin !== window.location.origin){
          next =
            new URL(
              "scelta-trattamenti.html",
              window.location.href
            ).href;
        }else{
          next = nextUrl.href;
        }
      }catch{
        next =
          new URL(
            "scelta-trattamenti.html",
            window.location.href
          ).href;
      }

      if(!tokenHash){
        fail(
          "Il link ricevuto non contiene il token di conferma. Richiedi una nuova email di registrazione."
        );
        return;
      }

      try{
        /*
          QUESTO È IL PASSAGGIO CHE MANCAVA:
          verifica il token_hash e ottiene una SESSIONE AUTENTICATA.
        */
        const { data, error } =
          await client.auth.verifyOtp({
            token_hash: tokenHash,
            type: type
          });

        if(error) throw error;

        if(!data?.user || !data?.session){
          throw new Error(
            "Supabase ha verificato l'email ma non ha restituito una sessione."
          );
        }

        /*
          Forziamo la persistenza della sessione nel browser PRIMA
          di entrare nella pagina Donna/Uomo.
        */
        const { error: setError } =
          await client.auth.setSession({
            access_token:
              data.session.access_token,
            refresh_token:
              data.session.refresh_token
          });

        if(setError) throw setError;

        /*
          Verifica reale: se qui non c'è la sessione,
          NON mandiamo avanti l'utente.
        */
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if(sessionError) throw sessionError;

        const session =
          sessionData?.session;

        if(!session?.user){
          throw new Error(
            "La sessione non è stata salvata nel browser."
          );
        }

        /*
          Verifica anche getUser(), che è ciò che poi usano
          Donna/Uomo e Profilo.
        */
        const { data: userData, error: userError } =
          await client.auth.getUser();

        if(userError) throw userError;

        if(!userData?.user){
          throw new Error(
            "L'utente autenticato non è disponibile."
          );
        }

        saveIdentity(userData.user);

        title.textContent =
          "Email confermata";

        message.textContent =
          "Sei già connesso a Beautyslot. Ti portiamo alla scelta dei trattamenti.";

        setTimeout(() => {
          window.location.replace(next);
        }, 500);

      }catch(error){
        console.error(
          "Beautyslot conferma account:",
          error
        );

        fail(
          error?.message ||
          "Link non valido, già utilizzato o scaduto."
        );
      }
    }

    confirmAccount();
  </script>
</body>
</html>
