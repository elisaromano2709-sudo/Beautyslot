<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beautyslot — Registrazione</title>
  <meta name="description" content="Registrati a Beautyslot per trovare servizi beauty o creare il calendario della tua attività." />

  <style>
    :root{
      --bg:#f7ecec;
      --bg-2:#f3e3e4;
      --rose:#bb8188;
      --rose-dark:#9d6870;
      --text:#6f5659;
      --muted:#957b7f;
      --line:rgba(173,116,124,.22);
      --card:rgba(255,255,255,.48);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:"Helvetica Neue",Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.58), transparent 34%),
        linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 18px;
    }

    .page{
      width:min(560px,100%);
      text-align:center;
    }

    .brand{
      margin-bottom:26px;
    }

    .brand-name{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:34px;
      font-weight:400;
      color:var(--rose-dark);
      letter-spacing:.2px;
    }

    .brand-tag{
      margin-top:7px;
      font-size:10px;
      letter-spacing:3.1px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .card{
      text-align:left;
      padding:36px 34px 30px;
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--card);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 18px 54px rgba(126,81,87,.08);
    }

    .kicker{
      text-align:center;
      font-size:11px;
      letter-spacing:2.8px;
      text-transform:uppercase;
      color:var(--rose);
      margin-bottom:14px;
    }

    h1{
      margin:0;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
      font-size:38px;
      line-height:1.1;
      font-weight:400;
      color:#765b5f;
    }

    .intro{
      margin:14px auto 28px;
      max-width:430px;
      text-align:center;
      font-size:14px;
      line-height:1.65;
      color:var(--muted);
    }

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin:0 0 8px 2px;
      font-size:11px;
      letter-spacing:1.5px;
      text-transform:uppercase;
      color:#7c666a;
    }

    input{
      width:100%;
      height:52px;
      border:1px solid rgba(169,108,116,.28);
      border-radius:16px;
      background:rgba(255,255,255,.55);
      padding:0 16px;
      color:#665155;
      font-size:15px;
      outline:none;
      transition:border-color .22s ease, box-shadow .22s ease, background .22s ease;
    }

    input::placeholder{
      color:#b09da0;
    }

    input:focus{
      border-color:rgba(169,108,116,.58);
      background:rgba(255,255,255,.76);
      box-shadow:0 0 0 4px rgba(187,129,136,.08);
    }

    .email-status{
      display:none;
      margin-top:8px;
      padding:10px 12px;
      border:1px solid rgba(181,91,104,.24);
      border-radius:12px;
      background:rgba(181,91,104,.055);
      color:#9f5964;
      font-size:11px;
      line-height:1.5;
    }

    .email-status.show{
      display:block;
    }

    .email-status a{
      color:var(--rose-dark);
      font-weight:700;
      text-decoration:none;
      border-bottom:1px solid rgba(157,104,112,.34);
    }

    input.email-error{
      border-color:rgba(181,91,104,.58);
      box-shadow:0 0 0 4px rgba(181,91,104,.07);
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:72px;
    }

    .show-password{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:var(--rose-dark);
      font-size:10px;
      letter-spacing:1px;
      text-transform:uppercase;
      cursor:pointer;
      padding:8px 0;
    }

    .submit{
      margin-top:8px;
      width:100%;
      min-height:50px;
      border-radius:999px;
      border:1px solid rgba(169,108,116,.42);
      background:rgba(255,255,255,.36);
      color:var(--rose-dark);
      font-size:11px;
      font-weight:600;
      letter-spacing:2.2px;
      text-transform:uppercase;
      cursor:pointer;
      transition:all .25s ease;
    }

    .submit:hover{
      background:rgba(255,255,255,.62);
      transform:translateY(-1px);
      box-shadow:0 8px 24px rgba(133,79,87,.08);
    }

    .login{
      margin-top:22px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }

    .login a,
    .back{
      color:var(--rose-dark);
      text-decoration:none;
      border-bottom:1px solid rgba(157,104,112,.34);
      padding-bottom:2px;
    }

    .back-row{
      margin-top:24px;
      text-align:center;
      font-size:12px;
    }

    @media (max-width:560px){
      body{padding:24px 14px}
      .card{padding:30px 22px 26px;border-radius:22px}
      h1{font-size:33px}
    }
    /* Area informativa mostrata solo nella registrazione professionista. */
    .professional-offer{
      display:none;
      margin-top:28px;
      text-align:left;
    }

    body.pro-mode{
      align-items:flex-start;
    }

    body.pro-mode .page{
      width:min(1180px,100%);
    }

    body.pro-mode .card{
      width:min(560px,100%);
      margin:0 auto;
    }

    body.pro-mode .professional-offer{
      display:block;
    }

    .trial-banner{
      margin:26px 0 22px;
      padding:24px 26px;
      border:1px solid rgba(157,104,112,.22);
      border-radius:24px;
      background:rgba(255,255,255,.62);
      box-shadow:0 14px 38px rgba(120,78,84,.06);
      text-align:center;
    }

    .trial-eyebrow{
      font-size:10px;
      font-weight:700;
      letter-spacing:1.8px;
      text-transform:uppercase;
      color:var(--rose);
    }

    .trial-banner h2{
      margin:8px 0 8px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(28px,4vw,40px);
      font-weight:400;
      color:var(--rose-dark);
    }

    .trial-banner p{
      margin:0 auto;
      max-width:760px;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .trial-points{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      margin-top:16px;
    }

    .trial-chip{
      padding:8px 11px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--text);
      font-size:10px;
      font-weight:650;
    }

    .plans-title{
      margin:36px 0 8px;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
      font-size:34px;
      font-weight:400;
      color:var(--rose-dark);
    }

    .plans-subtitle{
      margin:0 auto 22px;
      max-width:760px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .plans-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .plan-card{
      display:flex;
      flex-direction:column;
      min-height:100%;
      padding:23px;
      border:1px solid var(--line);
      border-radius:23px;
      background:rgba(255,255,255,.58);
      box-shadow:0 12px 34px rgba(120,78,84,.045);
    }

    .plan-card.pro{
      border-color:rgba(187,129,136,.52);
      background:rgba(255,255,255,.78);
      box-shadow:0 16px 42px rgba(120,78,84,.09);
    }

    .plan-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:13px;
    }

    .plan-name{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:27px;
      font-weight:400;
      color:var(--rose-dark);
    }

    .plan-tag{
      display:inline-flex;
      padding:6px 9px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      color:var(--rose-dark);
      font-size:9px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .plan-price{
      margin:0 0 5px;
      font-size:25px;
      font-weight:700;
      color:var(--text);
    }

    .plan-price small{
      font-size:11px;
      font-weight:500;
      color:var(--muted);
    }

    .plan-ideal{
      min-height:38px;
      margin:0 0 16px;
      color:var(--muted);
      font-size:12px;
      line-height:1.55;
    }

    .plan-card details{
      margin-top:auto;
      border-top:1px solid var(--line);
      padding-top:13px;
    }

    .plan-card summary{
      cursor:pointer;
      list-style:none;
      color:var(--rose-dark);
      font-size:11px;
      font-weight:700;
      letter-spacing:.5px;
    }

    .plan-card summary::-webkit-details-marker{display:none}

    .plan-card ul{
      margin:14px 0 0;
      padding-left:18px;
      color:var(--text);
      font-size:12px;
      line-height:1.65;
    }

    .plan-card li + li{margin-top:5px}

    .offer-section{
      margin-top:16px;
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:22px;
      background:rgba(255,255,255,.52);
    }

    .offer-section h3{
      margin:0 0 9px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:23px;
      font-weight:400;
      color:var(--rose-dark);
    }

    .offer-section p{
      margin:0;
      color:var(--muted);
      font-size:12px;
      line-height:1.65;
    }

    .offer-section ul{
      margin:12px 0 0;
      padding-left:18px;
      color:var(--text);
      font-size:12px;
      line-height:1.65;
    }

    .no-commission{
      margin:18px 0 0;
      padding:18px 20px;
      border:1px solid rgba(157,104,112,.24);
      border-radius:18px;
      background:#fff;
      text-align:center;
      color:var(--rose-dark);
      font-size:13px;
      font-weight:700;
      line-height:1.55;
    }

    .enterprise-note{
      margin-top:8px;
      font-size:10px;
      color:var(--muted);
    }

    @media(max-width:820px){
      .plans-grid{grid-template-columns:1fr}
      body.pro-mode .page{width:min(620px,100%)}
    }

    .selected-plan{
      display:none;
      margin:0 0 24px;
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.42);
      text-align:left;
    }
    body.pro-mode .selected-plan{display:block}
    .selected-plan-label{
      font-size:9px;
      font-weight:700;
      letter-spacing:1.5px;
      text-transform:uppercase;
      color:var(--rose);
    }
    .selected-plan-name{
      margin-top:5px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:22px;
      color:var(--rose-dark);
    }
    .selected-plan-desc{
      margin-top:5px;
      font-size:11px;
      line-height:1.55;
      color:var(--muted);
    }
    .change-plan{
      display:inline-block;
      margin-top:9px;
      color:var(--rose-dark);
      font-size:10px;
      font-weight:700;
      text-decoration:none;
      border-bottom:1px solid rgba(157,104,112,.34);
    }
    .plan-extra{display:none}
    .plan-extra.show{display:block}
    @media(max-width:560px){
      .trial-banner{padding:21px 18px}
      .plan-card{padding:20px}
      .offer-section{padding:20px}
    }

  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <h2 class="brand-name">Beautyslot</h2>
      <div class="brand-tag">Book beauty. Your way.</div>
    </header>

    <section class="card">
      <div class="kicker" id="kicker">Registrazione</div>
      <h1 id="title">Crea il tuo account</h1>
      <p class="intro" id="intro">
        Registrati per continuare su Beautyslot.
      </p>

      <div class="selected-plan" id="selectedPlanBox">
        <div class="selected-plan-label">Piano scelto</div>
        <div class="selected-plan-name" id="selectedPlanName">—</div>
        <div class="selected-plan-desc" id="selectedPlanDesc"></div>
        <a class="change-plan" href="piani-abbonamenti.html">Cambia piano</a>
      </div>

      <form id="registrationForm" novalidate>
        <input type="hidden" id="tipoUtente" name="tipoUtente" value="cliente">


        <div id="companyFields" hidden>
          <div class="field">
            <label for="azienda">Nome azienda</label>
            <input
              id="azienda"
              name="azienda"
              type="text"
              autocomplete="organization"
              placeholder="Nome della tua azienda"
            >
          </div>

          <div class="field">
            <label for="indirizzo_azienda">Via / indirizzo azienda</label>
            <input
              id="indirizzo_azienda"
              name="indirizzo_azienda"
              type="text"
              autocomplete="street-address"
              placeholder="Via e numero civico"
            >
          </div>
        </div>

        <div class="field">
          <label for="nome">Nome</label>
          <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="given-name"
            placeholder="Nome"
            required
          >
        </div>

        <div class="field">
          <label for="cognome">Cognome</label>
          <input
            id="cognome"
            name="cognome"
            type="text"
            autocomplete="family-name"
            placeholder="Cognome"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="nome@email.it"
            required
          >
          <div class="email-status" id="emailStatus" role="alert" aria-live="polite">
            Questa email è già registrata.
            <a href="login.html">Accedi</a>
            oppure usa un’altra email.
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crea una password"
              minlength="8"
              required
            >
            <button class="show-password" type="button" id="togglePassword">
              Mostra
            </button>
          </div>
        </div>

        <div class="field">
          <label for="telefono">Numero di telefono</label>
          <input
            id="telefono"
            name="telefono"
            type="tel"
            autocomplete="tel"
            inputmode="tel"
            placeholder="+39 333 123 4567"
            required
          >
        </div>

        <div class="field" id="instagramField" hidden>
          <label for="instagram">Instagram <span style="color:var(--muted);font-weight:400;">(facoltativo)</span></label>
          <input
            id="instagram"
            name="instagram"
            type="text"
            autocomplete="off"
            placeholder="@nomeprofilo"
          >
        </div>

        <div class="plan-extra" id="operatorsField">
          <div class="field">
            <label for="numero_operatori">Numero operatori</label>
            <select id="numero_operatori" name="numero_operatori">
              <option value="">Seleziona</option>
            </select>
          </div>
        </div>

        <div class="plan-extra" id="locationsField">
          <div class="field">
            <label for="numero_sedi">Numero sedi</label>
            <input id="numero_sedi" name="numero_sedi" type="number" min="1" step="1" placeholder="1">
          </div>
        </div>

        <button class="submit" type="submit" id="submitButton">
          Crea account
        </button>
      </form>

      <div class="login">
        Hai già un account?
        <a href="login.html">Accedi</a>
      </div>
    </section>
    <div class="back-row">
      <a class="back" href="index.html" id="backLink">← Torna indietro</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://kfhjydwgjtiyjdkedvrp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BueoI4fhTcQCdkaGnrtk9g_A0cJRkh7";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const tipo = params.get("tipo") === "professionista"
      ? "professionista"
      : "cliente";

    const VALID_PLANS = ["free","start","pro","business","enterprise","trial-pro"];
    const requestedPlan = (params.get("piano") || "").toLowerCase();
    const selectedPlan = VALID_PLANS.includes(requestedPlan) ? requestedPlan : "trial-pro";

    const PLAN_INFO = {
      "free": {name:"FREE · €0/mese", desc:"Profilo e visibilità su Beautyslot, senza calendario online."},
      "start": {name:"START · €14,90/mese", desc:"Per un professionista singolo con calendario e prenotazioni online."},
      "pro": {name:"PRO · €29,90/mese", desc:"Per saloni da 1 a 3 operatori con calendario condiviso, CRM e statistiche."},
      "business": {name:"BUSINESS · €49,90/mese", desc:"Per attività strutturate fino a 8 operatori, staff, risorse e marketing."},
      "enterprise": {name:"ENTERPRISE · su preventivo", desc:"Per gruppi, catene e attività con più sedi e molti operatori."},
      "trial-pro": {name:"PRO · 30 giorni gratis", desc:"Prova gratuita del piano PRO per 30 giorni, fino a 3 operatori."}
    };

    const tipoInput = document.getElementById("tipoUtente");
    const kicker = document.getElementById("kicker");
    const title = document.getElementById("title");
    const intro = document.getElementById("intro");
    const submitButton = document.getElementById("submitButton");
    const nomeLabel = document.querySelector('label[for="nome"]');
    const nomeInput = document.getElementById("nome");
    const cognomeLabel = document.querySelector('label[for="cognome"]');
    const cognomeInput = document.getElementById("cognome");
    const instagramField = document.getElementById("instagramField");
    const instagramInput = document.getElementById("instagram");
    const companyFields = document.getElementById("companyFields");
    const aziendaInput = document.getElementById("azienda");
    const indirizzoAziendaInput = document.getElementById("indirizzo_azienda");
    const selectedPlanBox = document.getElementById("selectedPlanBox");
    const selectedPlanName = document.getElementById("selectedPlanName");
    const selectedPlanDesc = document.getElementById("selectedPlanDesc");
    const operatorsField = document.getElementById("operatorsField");
    const locationsField = document.getElementById("locationsField");
    const operatorsInput = document.getElementById("numero_operatori");
    const locationsInput = document.getElementById("numero_sedi");
    const backLink = document.getElementById("backLink");

    function setOperatorOptions(max){
      operatorsInput.innerHTML = '<option value="">Seleziona</option>';
      for(let i = 1; i <= max; i++){
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = i === 1 ? "1 operatore" : i + " operatori";
        operatorsInput.appendChild(option);
      }
    }

    function configureSelectedPlan(){
      const info = PLAN_INFO[selectedPlan];
      selectedPlanName.textContent = info.name;
      selectedPlanDesc.textContent = info.desc;

      operatorsField.classList.remove("show");
      locationsField.classList.remove("show");
      operatorsInput.required = false;
      locationsInput.required = false;
      operatorsInput.innerHTML = '<option value="">Seleziona</option>';
      locationsInput.value = "";

      if(selectedPlan === "start"){
        const option = document.createElement("option");
        option.value = "1";
        option.textContent = "1 operatore";
        option.selected = true;
        operatorsInput.appendChild(option);
      }

      if(selectedPlan === "pro" || selectedPlan === "trial-pro"){
        operatorsField.classList.add("show");
        operatorsInput.required = true;
        setOperatorOptions(3);
      }

      if(selectedPlan === "business"){
        operatorsField.classList.add("show");
        operatorsInput.required = true;
        setOperatorOptions(8);
      }

      if(selectedPlan === "enterprise"){
        operatorsField.classList.add("show");
        locationsField.classList.add("show");
        operatorsInput.required = true;
        locationsInput.required = true;
        operatorsInput.innerHTML = '<option value="">Seleziona</option><option value="1-8">1–8 operatori</option><option value="9-20">9–20 operatori</option><option value="21-50">21–50 operatori</option><option value="50+">Più di 50 operatori</option>';
      }
    }

    tipoInput.value = tipo;

    if (tipo === "professionista") {
      document.body.classList.add("pro-mode");
      kicker.textContent = "Area professionisti";
      title.textContent = "Registrati come professionista";
      intro.textContent =
        "Crea il tuo account per iniziare a configurare la tua attività su Beautyslot.";
      submitButton.textContent = "Continua";

      companyFields.hidden = false;
      aziendaInput.required = true;
      indirizzoAziendaInput.required = true;

      nomeLabel.textContent = "Nome intestatario";
      nomeInput.placeholder = "Nome dell'intestatario";
      nomeInput.autocomplete = "given-name";

      cognomeLabel.textContent = "Cognome intestatario";
      cognomeInput.placeholder = "Cognome dell'intestatario";
      cognomeInput.autocomplete = "family-name";

      instagramField.hidden = false;
      configureSelectedPlan();
      backLink.href = "piani-abbonamenti.html";
    } else {
      kicker.textContent = "Area clienti";
      title.textContent = "Registrati su Beautyslot";
      intro.textContent =
        "Crea il tuo account per trovare il servizio più adatto a te e prenotare in autonomia.";
      submitButton.textContent = "Continua";

      companyFields.hidden = true;
      aziendaInput.required = false;
      indirizzoAziendaInput.required = false;
      aziendaInput.value = "";
      indirizzoAziendaInput.value = "";

      nomeLabel.textContent = "Nome";
      nomeInput.placeholder = "Nome";
      nomeInput.autocomplete = "given-name";

      cognomeLabel.textContent = "Cognome";
      cognomeInput.placeholder = "Cognome";
      cognomeInput.autocomplete = "family-name";

      instagramField.hidden = true;
      instagramInput.value = "";
      selectedPlanBox.style.display = "none";
      operatorsField.classList.remove("show");
      locationsField.classList.remove("show");
      operatorsInput.required = false;
      locationsInput.required = false;
    }

    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      togglePassword.textContent = visible ? "Mostra" : "Nascondi";
    });

    const form = document.getElementById("registrationForm");
    const emailInput = document.getElementById("email");
    const emailStatus = document.getElementById("emailStatus");

    function clearEmailStatus() {
      emailStatus.classList.remove("show");
      emailInput.classList.remove("email-error");
      emailInput.removeAttribute("aria-invalid");
    }

    function showDuplicateEmail() {
      emailStatus.classList.add("show");
      emailInput.classList.add("email-error");
      emailInput.setAttribute("aria-invalid", "true");
      emailInput.focus();
    }

    function isDuplicateSignup(data, error) {
      const code = String(error?.code || "").toLowerCase();
      const message = String(error?.message || "").toLowerCase();

      if (
        code === "user_already_exists" ||
        code === "email_exists" ||
        message.includes("already registered") ||
        message.includes("already exists") ||
        message.includes("already been registered") ||
        message.includes("user already registered")
      ) {
        return true;
      }

      /*
        Con conferma email attiva, Supabase può volutamente NON restituire
        un errore esplicito per un indirizzo già esistente.
        In quel caso restituisce un user "offuscato" senza identities.
        Questo controllo impedisce di mandare l'utente avanti come se
        la registrazione fosse nuova.
      */
      const identities = data?.user?.identities;

      return (
        data?.user &&
        Array.isArray(identities) &&
        identities.length === 0
      );
    }

    emailInput.addEventListener("input", clearEmailStatus);

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearEmailStatus();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const nome = document.getElementById("nome").value.trim();
      const cognome = document.getElementById("cognome").value.trim();
      const azienda = aziendaInput.value.trim();
      const indirizzoAzienda = indirizzoAziendaInput.value.trim();
      const instagram = instagramInput.value.trim();
      const email = document.getElementById("email").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const passwordValue = password.value;
      const numeroOperatori =
        tipo === "professionista"
          ? (selectedPlan === "start" ? "1" : operatorsInput.value)
          : "";
      const numeroSedi =
        tipo === "professionista" && selectedPlan === "enterprise"
          ? locationsInput.value.trim()
          : "";

      submitButton.disabled = true;
      submitButton.textContent = "Registrazione...";

      try {
        /*
          Se su questo browser era già collegato un altro account,
          lo disconnettiamo PRIMA di creare il nuovo account.
          Così la nuova registrazione non può ereditare la vecchia sessione.
        */
        await supabaseClient.auth.signOut();
        localStorage.removeItem("beautyslot_nome");
        localStorage.removeItem("beautyslot_cognome");
        localStorage.removeItem("beautyslot_full_name");
        localStorage.removeItem("beautyslot_user_id");
        localStorage.removeItem("beautyslot_email");
        sessionStorage.removeItem("beautyslot_tipo_utente");

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password: passwordValue,
          options: {
            emailRedirectTo:
              tipo === "cliente"
                ? "https://beauty-slot.it/scelta-trattamenti.html"
                : (
                    selectedPlan === "free"
                      ? "https://beauty-slot.it/registrazione-azienda-free.html"
                      : "https://beauty-slot.it/login.html"
                  ),
            data: {
              nome: nome,
              cognome: cognome,
              full_name: (nome + " " + cognome).trim(),
              telefono: telefono,
              tipo_utente: tipo,
              azienda: tipo === "professionista" ? azienda : "",
              indirizzo_azienda: tipo === "professionista" ? indirizzoAzienda : "",
              instagram: tipo === "professionista" ? instagram : "",
              piano_scelto: tipo === "professionista" ? selectedPlan : "",
              piano_base: tipo === "professionista" ? (selectedPlan === "trial-pro" ? "pro" : selectedPlan) : "",
              prova_30_giorni: tipo === "professionista" && selectedPlan === "trial-pro",
              numero_operatori: tipo === "professionista" ? numeroOperatori : "",
              numero_sedi: tipo === "professionista" ? numeroSedi : ""
            }
          }
        });

        if (isDuplicateSignup(data, error)) {
          showDuplicateEmail();
          return;
        }

        if (error) throw error;

        if (data.user) {
          /*
            NON salviamo nome/email come utente attivo prima della conferma.
            Verranno salvati solo quando Supabase avrà una sessione realmente
            autenticata per questo specifico user.id.
          */
          sessionStorage.setItem("beautyslot_pending_user_id", data.user.id || "");
          sessionStorage.setItem("beautyslot_pending_email", email);
          sessionStorage.setItem("beautyslot_pending_tipo_utente", tipo);
          if (tipo === "professionista") {
            sessionStorage.setItem("beautyslot_pending_piano", selectedPlan);
          }

          form.reset();

          if (!data.session) {
            window.location.href = "attesa-conferma.html";
            return;
          }

          /*
            Se il progetto non richiedesse conferma email e Supabase restituisse
            subito una sessione, sincronizziamo comunque l'identità corretta.
          */
          localStorage.setItem("beautyslot_user_id", data.user.id || "");
          localStorage.setItem("beautyslot_email", data.user.email || email);
          localStorage.setItem("beautyslot_nome", nome);
          localStorage.setItem("beautyslot_cognome", cognome);
          localStorage.setItem(
            "beautyslot_full_name",
            (nome + " " + cognome).trim()
          );

          window.location.href =
            tipo === "cliente"
              ? "scelta-trattamenti.html"
              : (
                  selectedPlan === "free"
                    ? "registrazione-azienda-free.html"
                    : "login.html"
                );
        }
      } catch (error) {
        console.error(error);

        if (isDuplicateSignup(null, error)) {
          showDuplicateEmail();
          return;
        }

        alert(
          "Errore durante la registrazione: " +
          (error.message || "Riprova.")
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Continua";
      }
    });
  </script>
</body>
</html>
