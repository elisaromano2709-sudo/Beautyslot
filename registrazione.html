<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beautyslot — Registrazione</title>
  <meta name="description" content="Registrati a Beautyslot per trovare servizi beauty o creare il calendario della tua attività." />

  <style>
    :root{
      --bg:#f7ecec;
      --bg-2:#f3e3e4;
      --rose:#bb8188;
      --rose-dark:#9d6870;
      --text:#6f5659;
      --muted:#957b7f;
      --line:rgba(173,116,124,.22);
      --card:rgba(255,255,255,.48);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:"Helvetica Neue",Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.58), transparent 34%),
        linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 18px;
    }

    .page{
      width:min(560px,100%);
      text-align:center;
    }

    .brand{
      margin-bottom:26px;
    }

    .brand-name{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:34px;
      font-weight:400;
      color:var(--rose-dark);
      letter-spacing:.2px;
    }

    .brand-tag{
      margin-top:7px;
      font-size:10px;
      letter-spacing:3.1px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .card{
      text-align:left;
      padding:36px 34px 30px;
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--card);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 18px 54px rgba(126,81,87,.08);
    }

    .kicker{
      text-align:center;
      font-size:11px;
      letter-spacing:2.8px;
      text-transform:uppercase;
      color:var(--rose);
      margin-bottom:14px;
    }

    h1{
      margin:0;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
      font-size:38px;
      line-height:1.1;
      font-weight:400;
      color:#765b5f;
    }

    .intro{
      margin:14px auto 28px;
      max-width:430px;
      text-align:center;
      font-size:14px;
      line-height:1.65;
      color:var(--muted);
    }

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin:0 0 8px 2px;
      font-size:11px;
      letter-spacing:1.5px;
      text-transform:uppercase;
      color:#7c666a;
    }

    input{
      width:100%;
      height:52px;
      border:1px solid rgba(169,108,116,.28);
      border-radius:16px;
      background:rgba(255,255,255,.55);
      padding:0 16px;
      color:#665155;
      font-size:15px;
      outline:none;
      transition:border-color .22s ease, box-shadow .22s ease, background .22s ease;
    }

    input::placeholder{
      color:#b09da0;
    }

    input:focus{
      border-color:rgba(169,108,116,.58);
      background:rgba(255,255,255,.76);
      box-shadow:0 0 0 4px rgba(187,129,136,.08);
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:72px;
    }

    .show-password{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:var(--rose-dark);
      font-size:10px;
      letter-spacing:1px;
      text-transform:uppercase;
      cursor:pointer;
      padding:8px 0;
    }

    .submit{
      margin-top:8px;
      width:100%;
      min-height:50px;
      border-radius:999px;
      border:1px solid rgba(169,108,116,.42);
      background:rgba(255,255,255,.36);
      color:var(--rose-dark);
      font-size:11px;
      font-weight:600;
      letter-spacing:2.2px;
      text-transform:uppercase;
      cursor:pointer;
      transition:all .25s ease;
    }

    .submit:hover{
      background:rgba(255,255,255,.62);
      transform:translateY(-1px);
      box-shadow:0 8px 24px rgba(133,79,87,.08);
    }

    .login{
      margin-top:22px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }

    .login a,
    .back{
      color:var(--rose-dark);
      text-decoration:none;
      border-bottom:1px solid rgba(157,104,112,.34);
      padding-bottom:2px;
    }

    .back-row{
      margin-top:24px;
      text-align:center;
      font-size:12px;
    }

    @media (max-width:560px){
      body{padding:24px 14px}
      .card{padding:30px 22px 26px;border-radius:22px}
      h1{font-size:33px}
    }
    /* Area informativa mostrata solo nella registrazione professionista. */
    .professional-offer{
      display:none;
      margin-top:28px;
      text-align:left;
    }

    body.pro-mode{
      align-items:flex-start;
    }

    body.pro-mode .page{
      width:min(1180px,100%);
    }

    body.pro-mode .card{
      width:min(560px,100%);
      margin:0 auto;
    }

    body.pro-mode .professional-offer{
      display:block;
    }

    .trial-banner{
      margin:26px 0 22px;
      padding:24px 26px;
      border:1px solid rgba(157,104,112,.22);
      border-radius:24px;
      background:rgba(255,255,255,.62);
      box-shadow:0 14px 38px rgba(120,78,84,.06);
      text-align:center;
    }

    .trial-eyebrow{
      font-size:10px;
      font-weight:700;
      letter-spacing:1.8px;
      text-transform:uppercase;
      color:var(--rose);
    }

    .trial-banner h2{
      margin:8px 0 8px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(28px,4vw,40px);
      font-weight:400;
      color:var(--rose-dark);
    }

    .trial-banner p{
      margin:0 auto;
      max-width:760px;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .trial-points{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      margin-top:16px;
    }

    .trial-chip{
      padding:8px 11px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--text);
      font-size:10px;
      font-weight:650;
    }

    .plans-title{
      margin:36px 0 8px;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
      font-size:34px;
      font-weight:400;
      color:var(--rose-dark);
    }

    .plans-subtitle{
      margin:0 auto 22px;
      max-width:760px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .plans-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .plan-card{
      display:flex;
      flex-direction:column;
      min-height:100%;
      padding:23px;
      border:1px solid var(--line);
      border-radius:23px;
      background:rgba(255,255,255,.58);
      box-shadow:0 12px 34px rgba(120,78,84,.045);
    }

    .plan-card.pro{
      border-color:rgba(187,129,136,.52);
      background:rgba(255,255,255,.78);
      box-shadow:0 16px 42px rgba(120,78,84,.09);
    }

    .plan-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:13px;
    }

    .plan-name{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:27px;
      font-weight:400;
      color:var(--rose-dark);
    }

    .plan-tag{
      display:inline-flex;
      padding:6px 9px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      color:var(--rose-dark);
      font-size:9px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .plan-price{
      margin:0 0 5px;
      font-size:25px;
      font-weight:700;
      color:var(--text);
    }

    .plan-price small{
      font-size:11px;
      font-weight:500;
      color:var(--muted);
    }

    .plan-ideal{
      min-height:38px;
      margin:0 0 16px;
      color:var(--muted);
      font-size:12px;
      line-height:1.55;
    }

    .plan-card details{
      margin-top:auto;
      border-top:1px solid var(--line);
      padding-top:13px;
    }

    .plan-card summary{
      cursor:pointer;
      list-style:none;
      color:var(--rose-dark);
      font-size:11px;
      font-weight:700;
      letter-spacing:.5px;
    }

    .plan-card summary::-webkit-details-marker{display:none}

    .plan-card ul{
      margin:14px 0 0;
      padding-left:18px;
      color:var(--text);
      font-size:12px;
      line-height:1.65;
    }

    .plan-card li + li{margin-top:5px}

    .offer-section{
      margin-top:16px;
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:22px;
      background:rgba(255,255,255,.52);
    }

    .offer-section h3{
      margin:0 0 9px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:23px;
      font-weight:400;
      color:var(--rose-dark);
    }

    .offer-section p{
      margin:0;
      color:var(--muted);
      font-size:12px;
      line-height:1.65;
    }

    .offer-section ul{
      margin:12px 0 0;
      padding-left:18px;
      color:var(--text);
      font-size:12px;
      line-height:1.65;
    }

    .no-commission{
      margin:18px 0 0;
      padding:18px 20px;
      border:1px solid rgba(157,104,112,.24);
      border-radius:18px;
      background:#fff;
      text-align:center;
      color:var(--rose-dark);
      font-size:13px;
      font-weight:700;
      line-height:1.55;
    }

    .enterprise-note{
      margin-top:8px;
      font-size:10px;
      color:var(--muted);
    }

    @media(max-width:820px){
      .plans-grid{grid-template-columns:1fr}
      body.pro-mode .page{width:min(620px,100%)}
    }

    @media(max-width:560px){
      .trial-banner{padding:21px 18px}
      .plan-card{padding:20px}
      .offer-section{padding:20px}
    }

  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <h2 class="brand-name">Beautyslot</h2>
      <div class="brand-tag">Book beauty. Your way.</div>
    </header>

    <section class="card">
      <div class="kicker" id="kicker">Registrazione</div>
      <h1 id="title">Crea il tuo account</h1>
      <p class="intro" id="intro">
        Registrati per continuare su Beautyslot.
      </p>

      <form id="registrationForm" novalidate>
        <input type="hidden" id="tipoUtente" name="tipoUtente" value="cliente">


        <div id="companyFields" hidden>
          <div class="field">
            <label for="azienda">Nome azienda</label>
            <input
              id="azienda"
              name="azienda"
              type="text"
              autocomplete="organization"
              placeholder="Nome della tua azienda"
            >
          </div>

          <div class="field">
            <label for="indirizzo_azienda">Via / indirizzo azienda</label>
            <input
              id="indirizzo_azienda"
              name="indirizzo_azienda"
              type="text"
              autocomplete="street-address"
              placeholder="Via e numero civico"
            >
          </div>
        </div>

        <div class="field">
          <label for="nome">Nome</label>
          <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="given-name"
            placeholder="Nome"
            required
          >
        </div>

        <div class="field">
          <label for="cognome">Cognome</label>
          <input
            id="cognome"
            name="cognome"
            type="text"
            autocomplete="family-name"
            placeholder="Cognome"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="nome@email.it"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crea una password"
              minlength="8"
              required
            >
            <button class="show-password" type="button" id="togglePassword">
              Mostra
            </button>
          </div>
        </div>

        <div class="field">
          <label for="telefono">Numero di telefono</label>
          <input
            id="telefono"
            name="telefono"
            type="tel"
            autocomplete="tel"
            inputmode="tel"
            placeholder="+39 333 123 4567"
            required
          >
        </div>

        <div class="field" id="instagramField" hidden>
          <label for="instagram">Instagram <span style="color:var(--muted);font-weight:400;">(facoltativo)</span></label>
          <input
            id="instagram"
            name="instagram"
            type="text"
            autocomplete="off"
            placeholder="@nomeprofilo"
          >
        </div>

        <button class="submit" type="submit" id="submitButton">
          Crea account
        </button>
      </form>

      <div class="login">
        Hai già un account?
        <a href="login.html">Accedi</a>
      </div>
    </section>
    <div class="back-row">
      <a class="back" href="index.html">← Torna indietro</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://kfhjydwgjtiyjdkedvrp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BueoI4fhTcQCdkaGnrtk9g_A0cJRkh7";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const tipo = params.get("tipo") === "professionista"
      ? "professionista"
      : "cliente";

    const tipoInput = document.getElementById("tipoUtente");
    const kicker = document.getElementById("kicker");
    const title = document.getElementById("title");
    const intro = document.getElementById("intro");
    const submitButton = document.getElementById("submitButton");
    const nomeLabel = document.querySelector('label[for="nome"]');
    const nomeInput = document.getElementById("nome");
    const cognomeLabel = document.querySelector('label[for="cognome"]');
    const cognomeInput = document.getElementById("cognome");
    const instagramField = document.getElementById("instagramField");
    const instagramInput = document.getElementById("instagram");
    const companyFields = document.getElementById("companyFields");
    const aziendaInput = document.getElementById("azienda");
    const indirizzoAziendaInput = document.getElementById("indirizzo_azienda");

    tipoInput.value = tipo;

    if (tipo === "professionista") {
      document.body.classList.add("pro-mode");
      kicker.textContent = "Area professionisti";
      title.textContent = "Registrati come professionista";
      intro.textContent =
        "Crea il tuo account per iniziare a configurare la tua attività su Beautyslot.";
      submitButton.textContent = "Continua";

      companyFields.hidden = false;
      aziendaInput.required = true;
      indirizzoAziendaInput.required = true;

      nomeLabel.textContent = "Nome intestatario";
      nomeInput.placeholder = "Nome dell'intestatario";
      nomeInput.autocomplete = "given-name";

      cognomeLabel.textContent = "Cognome intestatario";
      cognomeInput.placeholder = "Cognome dell'intestatario";
      cognomeInput.autocomplete = "family-name";

      instagramField.hidden = false;
    } else {
      kicker.textContent = "Area clienti";
      title.textContent = "Registrati su Beautyslot";
      intro.textContent =
        "Crea il tuo account per trovare il servizio più adatto a te e prenotare in autonomia.";
      submitButton.textContent = "Continua";

      companyFields.hidden = true;
      aziendaInput.required = false;
      indirizzoAziendaInput.required = false;
      aziendaInput.value = "";
      indirizzoAziendaInput.value = "";

      nomeLabel.textContent = "Nome";
      nomeInput.placeholder = "Nome";
      nomeInput.autocomplete = "given-name";

      cognomeLabel.textContent = "Cognome";
      cognomeInput.placeholder = "Cognome";
      cognomeInput.autocomplete = "family-name";

      instagramField.hidden = true;
      instagramInput.value = "";
    }

    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      togglePassword.textContent = visible ? "Mostra" : "Nascondi";
    });

    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const nome = document.getElementById("nome").value.trim();
      const cognome = document.getElementById("cognome").value.trim();
      const azienda = aziendaInput.value.trim();
      const indirizzoAzienda = indirizzoAziendaInput.value.trim();
      const instagram = instagramInput.value.trim();
      const email = document.getElementById("email").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const passwordValue = password.value;

      submitButton.disabled = true;
      submitButton.textContent = "Registrazione...";

      try {
        /*
          Se su questo browser era già collegato un altro account,
          lo disconnettiamo PRIMA di creare il nuovo account.
          Così la nuova registrazione non può ereditare la vecchia sessione.
        */
        await supabaseClient.auth.signOut();
        localStorage.removeItem("beautyslot_nome");
        localStorage.removeItem("beautyslot_cognome");
        localStorage.removeItem("beautyslot_full_name");
        localStorage.removeItem("beautyslot_user_id");
        localStorage.removeItem("beautyslot_email");
        sessionStorage.removeItem("beautyslot_tipo_utente");

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password: passwordValue,
          options: {
            emailRedirectTo:
              tipo === "cliente"
                ? "https://beauty-slot.it/scelta-trattamenti.html"
                : "https://beauty-slot.it/piani-abbonamenti.html",
            data: {
              nome: nome,
              cognome: cognome,
              full_name: (nome + " " + cognome).trim(),
              telefono: telefono,
              tipo_utente: tipo,
              azienda: tipo === "professionista" ? azienda : "",
              indirizzo_azienda: tipo === "professionista" ? indirizzoAzienda : "",
              instagram: tipo === "professionista" ? instagram : ""
            }
          }
        });

        if (error) throw error;

        if (data.user) {
          /*
            NON salviamo nome/email come utente attivo prima della conferma.
            Verranno salvati solo quando Supabase avrà una sessione realmente
            autenticata per questo specifico user.id.
          */
          sessionStorage.setItem("beautyslot_pending_user_id", data.user.id || "");
          sessionStorage.setItem("beautyslot_pending_email", email);
          sessionStorage.setItem("beautyslot_pending_tipo_utente", tipo);

          form.reset();

          if (!data.session) {
            window.location.href = "attesa-conferma.html";
            return;
          }

          /*
            Se il progetto non richiedesse conferma email e Supabase restituisse
            subito una sessione, sincronizziamo comunque l'identità corretta.
          */
          localStorage.setItem("beautyslot_user_id", data.user.id || "");
          localStorage.setItem("beautyslot_email", data.user.email || email);
          localStorage.setItem("beautyslot_nome", nome);
          localStorage.setItem("beautyslot_cognome", cognome);
          localStorage.setItem(
            "beautyslot_full_name",
            (nome + " " + cognome).trim()
          );

          window.location.href =
            tipo === "cliente"
              ? "scelta-trattamenti.html"
              : "piani-abbonamenti.html";
        }
      } catch (error) {
        console.error(error);
        alert("Errore durante la registrazione: " + (error.message || "Riprova."));
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Continua";
      }
    });
  </script>
</body>
</html>
