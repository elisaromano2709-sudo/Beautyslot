<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beautyslot — Registrazione</title>
  <meta name="description" content="Registrati a Beautyslot per trovare servizi beauty o creare il calendario della tua attività." />

  <style>
    :root{
      --bg:#f7ecec;
      --bg-2:#f3e3e4;
      --rose:#bb8188;
      --rose-dark:#9d6870;
      --text:#6f5659;
      --muted:#957b7f;
      --line:rgba(173,116,124,.22);
      --card:rgba(255,255,255,.48);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:"Helvetica Neue",Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.58), transparent 34%),
        linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 18px;
    }

    .page{
      width:min(560px,100%);
      text-align:center;
    }

    .brand{
      margin-bottom:26px;
    }

    .brand-name{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:34px;
      font-weight:400;
      color:var(--rose-dark);
      letter-spacing:.2px;
    }

    .brand-tag{
      margin-top:7px;
      font-size:10px;
      letter-spacing:3.1px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .card{
      text-align:left;
      padding:36px 34px 30px;
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--card);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 18px 54px rgba(126,81,87,.08);
    }

    .kicker{
      text-align:center;
      font-size:11px;
      letter-spacing:2.8px;
      text-transform:uppercase;
      color:var(--rose);
      margin-bottom:14px;
    }

    h1{
      margin:0;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
      font-size:38px;
      line-height:1.1;
      font-weight:400;
      color:#765b5f;
    }

    .intro{
      margin:14px auto 28px;
      max-width:430px;
      text-align:center;
      font-size:14px;
      line-height:1.65;
      color:var(--muted);
    }

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin:0 0 8px 2px;
      font-size:11px;
      letter-spacing:1.5px;
      text-transform:uppercase;
      color:#7c666a;
    }

    input{
      width:100%;
      height:52px;
      border:1px solid rgba(169,108,116,.28);
      border-radius:16px;
      background:rgba(255,255,255,.55);
      padding:0 16px;
      color:#665155;
      font-size:15px;
      outline:none;
      transition:border-color .22s ease, box-shadow .22s ease, background .22s ease;
    }

    input::placeholder{
      color:#b09da0;
    }

    input:focus{
      border-color:rgba(169,108,116,.58);
      background:rgba(255,255,255,.76);
      box-shadow:0 0 0 4px rgba(187,129,136,.08);
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:72px;
    }

    .show-password{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:var(--rose-dark);
      font-size:10px;
      letter-spacing:1px;
      text-transform:uppercase;
      cursor:pointer;
      padding:8px 0;
    }

    .submit{
      margin-top:8px;
      width:100%;
      min-height:50px;
      border-radius:999px;
      border:1px solid rgba(169,108,116,.42);
      background:rgba(255,255,255,.36);
      color:var(--rose-dark);
      font-size:11px;
      font-weight:600;
      letter-spacing:2.2px;
      text-transform:uppercase;
      cursor:pointer;
      transition:all .25s ease;
    }

    .submit:hover{
      background:rgba(255,255,255,.62);
      transform:translateY(-1px);
      box-shadow:0 8px 24px rgba(133,79,87,.08);
    }

    .login{
      margin-top:22px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }

    .login a,
    .back{
      color:var(--rose-dark);
      text-decoration:none;
      border-bottom:1px solid rgba(157,104,112,.34);
      padding-bottom:2px;
    }

    .back-row{
      margin-top:24px;
      text-align:center;
      font-size:12px;
    }

    @media (max-width:560px){
      body{padding:24px 14px}
      .card{padding:30px 22px 26px;border-radius:22px}
      h1{font-size:33px}
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <h2 class="brand-name">Beautyslot</h2>
      <div class="brand-tag">Book beauty. Your way.</div>
    </header>

    <section class="card">
      <div class="kicker" id="kicker">Registrazione</div>
      <h1 id="title">Crea il tuo account</h1>
      <p class="intro" id="intro">
        Registrati per continuare su Beautyslot.
      </p>

      <form id="registrationForm" novalidate>
        <input type="hidden" id="tipoUtente" name="tipoUtente" value="cliente">

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="nome@email.it"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crea una password"
              minlength="8"
              required
            >
            <button class="show-password" type="button" id="togglePassword">
              Mostra
            </button>
          </div>
        </div>

        <div class="field">
          <label for="telefono">Numero di telefono</label>
          <input
            id="telefono"
            name="telefono"
            type="tel"
            autocomplete="tel"
            inputmode="tel"
            placeholder="+39 333 123 4567"
            required
          >
        </div>

        <button class="submit" type="submit" id="submitButton">
          Crea account
        </button>
      </form>

      <div class="login">
        Hai già un account?
        <a href="login.html">Accedi</a>
      </div>
    </section>

    <div class="back-row">
      <a class="back" href="accesso.html">← Torna indietro</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://kfhjydwgjtiyjdkedvrp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BueoI4fhTcQCdkaGnrtk9g_A0cJRkh7";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const tipo = params.get("tipo") === "professionista"
      ? "professionista"
      : "cliente";

    const tipoInput = document.getElementById("tipoUtente");
    const kicker = document.getElementById("kicker");
    const title = document.getElementById("title");
    const intro = document.getElementById("intro");
    const submitButton = document.getElementById("submitButton");

    tipoInput.value = tipo;

    if (tipo === "professionista") {
      kicker.textContent = "Area professionisti";
      title.textContent = "Registrati come professionista";
      intro.textContent =
        "Crea il tuo account per iniziare a configurare il tuo calendario Beautyslot.";
      submitButton.textContent = "Continua";
    } else {
      kicker.textContent = "Area clienti";
      title.textContent = "Registrati su Beautyslot";
      intro.textContent =
        "Crea il tuo account per trovare il servizio più adatto a te e prenotare in autonomia.";
      submitButton.textContent = "Continua";
    }

    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      togglePassword.textContent = visible ? "Mostra" : "Nascondi";
    });

    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const email = document.getElementById("email").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const passwordValue = password.value;

      submitButton.disabled = true;
      submitButton.textContent = "Registrazione...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password: passwordValue,
          options: {
            data: {
              telefono: telefono,
              tipo_utente: tipo
            }
          }
        });

        if (error) throw error;

        if (data.user) {
          form.reset();

          if (tipo === "cliente") {
            sessionStorage.setItem("beautyslot_tipo_utente", "cliente");
            window.location.href = new URL(
              "scelta-trattamenti.html",
              window.location.href
            ).href;
            return;
          }

          alert(
            "Registrazione completata. " +
            (data.session
              ? "Il tuo account è attivo."
              : "Controlla la tua email per confermare l'account.")
          );
        }
      } catch (error) {
        console.error(error);
        alert("Errore durante la registrazione: " + (error.message || "Riprova."));
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Continua";
      }
    });
  </script>
</body>
</html>
