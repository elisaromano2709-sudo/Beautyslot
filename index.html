    .enter-button {
      position: absolute;
      left: 50%;
      top: calc(50% - min(50vw, 50svh) + min(74vw, 74svh) + 60px);
      transform: translateX(-50%) scale(1);
      width: min(33.5vw, 33.5svh);
      height: min(6.35vw, 6.35svh);
      min-width: 230px;
      border: 1px solid rgba(199, 137, 116, 0.70);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #7d5e54;
      background: linear-gradient(180deg,
        rgba(255, 248, 244, .82) 0%,
        rgba(241, 205, 191, .68) 100%);
      box-shadow:
        0 7px 14px rgba(147, 93, 73, .12),
        inset 0 1px 0 rgba(255,255,255,.88);
      font-size: clamp(12px, 1.5vw, 22px);
      font-weight: 400;
      letter-spacing: .20em;
      text-transform: uppercase;
      cursor: pointer;
      transform-origin: center;
      animation: beautyBreath 4s ease-in-out infinite;
      transition: border-color .25s ease, box-shadow .25s ease, color .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-button:hover {
      border-color: rgba(179, 114, 93, .85);
      box-shadow:
        0 8px 18px rgba(147, 93, 73, .16),
        inset 0 1px 0 rgba(255,255,255,.92);
    }

    .enter-button:focus-visible {
      outline: 2px solid rgba(190, 126, 105, .45);
      outline-offset: 4px;
    }

    @keyframes beautyBreath {
      0%, 72%, 100% {
        transform: translateX(-50%) scale(1);
      }
      82% {
        transform: translateX(-50%) scale(1.027);
      }
      90% {
        transform: translateX(-50%) scale(0.995);
      }
      96% {
        transform: translateX(-50%) scale(1.008);
      }
    }

    @media (max-aspect-ratio: 1 / 1) {
      .enter-button { min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .enter-button { animation: none; }
    }
  </style>
