<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautyslot — Le mie prenotazioni</title>
  <style>
    :root{
      --bg:#f7ecec;--bg2:#f1e1e3;--accent:#bb8188;--dark:#9d6870;
      --text:#5f5558;--muted:#8d8386;--line:rgba(157,104,112,.18);--white:#fff;
    }
    body.uomo{
      --bg:#eef5fa;--bg2:#e7f0f7;--accent:#86abc7;--dark:#5f87a5;
      --text:#4b5e69;--muted:#7f8d98;--line:rgba(95,135,165,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Helvetica Neue",Arial,sans-serif}
    body{
      min-height:100vh;color:var(--text);
      background:linear-gradient(180deg,var(--bg),var(--bg2));
    }
    .topbar{
      display:grid;grid-template-columns:52px 1fr 52px;align-items:center;
      padding:13px 16px;border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.72)
    }
    .back{
      width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;
      background:transparent;color:var(--text);font-size:24px;text-decoration:none
    }
    .brand{text-align:center}
    .brand-name{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;color:var(--dark)}
    .brand-tag{margin-top:5px;font-size:8px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted)}
    .page{width:min(760px,calc(100% - 28px));margin:28px auto}
    .card{padding:30px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.78)}
    .kicker{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent)}
    h1{margin:8px 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;color:var(--dark)}
    .lead{margin:0 0 24px;font-size:13px;line-height:1.6;color:var(--muted)}
    .booking{display:none;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}
    .booking.show{display:block}
    .booking + .booking{margin-top:14px}
    .row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
    .row:last-child{border-bottom:0}
    .label{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
    .value{font-size:14px}
    .empty{padding:24px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);font-size:13px}
    .booking-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .action-btn{
      min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
      background:#fff;color:var(--dark);font:inherit;font-size:12px;font-weight:700;
      letter-spacing:.4px;cursor:pointer;transition:.18s ease
    }
    .action-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,#fff)}
    .action-btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
    .action-btn.danger{color:#9a535b;border-color:rgba(154,83,91,.25);background:#fff}
    .action-btn.danger:hover{background:rgba(154,83,91,.07);border-color:rgba(154,83,91,.45)}

    .cancel-modal{
      display:none;position:fixed;inset:0;z-index:1000;padding:20px;
      align-items:center;justify-content:center;background:rgba(53,43,46,.42);
      backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)
    }
    .cancel-modal.open{display:flex}
    .cancel-dialog{
      width:min(440px,100%);padding:26px;border:1px solid var(--line);border-radius:24px;
      background:#fff;box-shadow:0 24px 70px rgba(45,35,38,.20);text-align:center
    }
    .cancel-dialog h2{
      margin:0 0 10px;font-family:Georgia,"Times New Roman",serif;
      font-size:28px;font-weight:400;color:var(--dark)
    }
    .cancel-dialog p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
    .cancel-salon{font-weight:700;color:var(--text)}
    .cancel-dialog-actions{display:flex;gap:10px;margin-top:22px}
    .cancel-dialog-actions .action-btn{flex:1}

    @media(max-width:520px){
      .row{grid-template-columns:1fr;gap:4px}.card{padding:22px}.booking-actions{flex-direction:column}.action-btn{width:100%}
      .cancel-dialog{padding:22px 18px;border-radius:21px}
      .cancel-dialog-actions{flex-direction:column}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" id="backLink" href="./donna.html" aria-label="Torna indietro">←</a>
    <div class="brand">
      <h2 class="brand-name">Beautyslot</h2>
      <div class="brand-tag">Book beauty. Your way.</div>
    </div>
    <div></div>
  </header>

  <main class="page">
    <section class="card">
      <div class="kicker">Il mio account</div>
      <h1>Le mie prenotazioni</h1>
      <p class="lead">Qui troverai gli appuntamenti associati al tuo account Beautyslot.</p>

      <div id="bookingsList"></div>

      <div class="empty" id="empty">
        Non ci sono ancora prenotazioni associate al tuo account.
      </div>
    </section>
  </main>

  <div class="cancel-modal" id="cancelModal" aria-hidden="true">
    <div class="cancel-dialog" role="dialog" aria-modal="true" aria-labelledby="cancelTitle">
      <h2 id="cancelTitle">Vuoi disdire l'appuntamento?</h2>
      <div class="cancel-dialog-actions">
        <button class="action-btn" id="keepBookingButton" type="button">No, mantieni appuntamento</button>
        <button class="action-btn danger" id="confirmCancelButton" type="button">Conferma disdetta</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL=
      "https://kfhjydwgjtiyjdkedvrp.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY=
      "sb_publishable_BueoI4fhTcQCdkaGnrtk9g_A0cJRkh7";

    const sb=
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true
          }
        }
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const tema =
      params.get("tema") === "uomo"
        ? "uomo"
        : "donna";

    const bookingStorageKey =
      "beautyslot_last_booking_" +
      tema;

    if(tema === "uomo"){
      document.body.classList.add(
        "uomo"
      );

      document
        .getElementById("backLink")
        .href =
          "./uomo.html";
    }

    const bookingsList =
      document.getElementById(
        "bookingsList"
      );

    const emptyBox =
      document.getElementById(
        "empty"
      );

    const cancelModal =
      document.getElementById(
        "cancelModal"
      );

    const keepBookingButton =
      document.getElementById(
        "keepBookingButton"
      );

    const confirmCancelButton =
      document.getElementById(
        "confirmCancelButton"
      );

    let activeBooking = null;
    let currentUser = null;
    let bookingsChannel = null;

    function formatDate(value){
      if(!value){
        return "—";
      }

      const parts=
        String(value)
          .split("-")
          .map(Number);

      if(parts.length !== 3){
        return value;
      }

      const date=
        new Date(
          parts[0],
          parts[1]-1,
          parts[2]
        );

      return new Intl.DateTimeFormat(
        "it-IT",
        {
          weekday:"long",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      ).format(date);
    }

    function timeShort(value){
      return (
        String(value || "")
          .slice(0,5) ||
        "—"
      );
    }

    function buildMapUrl(booking){
      const lat=
        Number(
          booking.lat ??
          booking.latitude
        );

      const lng=
        Number(
          booking.lng ??
          booking.longitude
        );

      if(
        Number.isFinite(lat) &&
        Number.isFinite(lng)
      ){
        return (
          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(
            lat + "," + lng
          )
        );
      }

      const query=
        [
          booking.salon,
          booking.address
        ]
          .filter(Boolean)
          .join(" ");

      return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
          query ||
          "Beautyslot"
        )
      );
    }

    function openCancelModal(booking){
      activeBooking=
        booking;

      cancelModal.classList.add(
        "open"
      );

      cancelModal.setAttribute(
        "aria-hidden",
        "false"
      );

      confirmCancelButton.focus();
    }

    function closeCancelModal(){
      cancelModal.classList.remove(
        "open"
      );

      cancelModal.setAttribute(
        "aria-hidden",
        "true"
      );
    }

    function bookingCard(booking){
      const card=
        document.createElement(
          "div"
        );

      card.className=
        "booking show";

      card.dataset.bookingId=
        booking.id ||
        "";

      card.innerHTML=`
        <div class="row">
          <div class="label">Salone</div>
          <div class="value" data-field="salon"></div>
        </div>
        <div class="row">
          <div class="label">Trattamento</div>
          <div class="value" data-field="service"></div>
        </div>
        <div class="row">
          <div class="label">Data</div>
          <div class="value" data-field="date"></div>
        </div>
        <div class="row">
          <div class="label">Orario</div>
          <div class="value" data-field="time"></div>
        </div>
        <div class="booking-actions">
          <button
            class="action-btn primary"
            data-action="map"
            type="button"
          >
            Apri mappa
          </button>
          <button
            class="action-btn danger"
            data-action="cancel"
            type="button"
          >
            Disdici appuntamento
          </button>
        </div>
      `;

      card.querySelector(
        '[data-field="salon"]'
      ).textContent=
        booking.salon ||
        "Salone Beautyslot";

      card.querySelector(
        '[data-field="service"]'
      ).textContent=
        booking.service ||
        "—";

      card.querySelector(
        '[data-field="date"]'
      ).textContent=
        booking.date ||
        "—";

      card.querySelector(
        '[data-field="time"]'
      ).textContent=
        booking.time ||
        "—";

      card.querySelector(
        '[data-action="map"]'
      ).addEventListener(
        "click",
        ()=>{
          window.open(
            buildMapUrl(booking),
            "_blank",
            "noopener,noreferrer"
          );
        }
      );

      card.querySelector(
        '[data-action="cancel"]'
      ).addEventListener(
        "click",
        ()=>{
          openCancelModal(
            booking
          );
        }
      );

      return card;
    }

    function sessionFallbackBooking(){
      const currentRaw=
        sessionStorage.getItem(
          bookingStorageKey
        );

      const legacyRaw=
        sessionStorage.getItem(
          "beautyslot_last_booking"
        );

      const candidates=
        [
          currentRaw,
          legacyRaw
        ].filter(Boolean);

      for(const raw of candidates){
        try{
          const booking=
            JSON.parse(raw);

          const explicitTheme=
            booking?.tema ||
            booking?.gender ||
            "";

          if(
            explicitTheme &&
            explicitTheme !== tema
          ){
            continue;
          }

          return {
            id:null,
            source:"session",
            salon:
              booking.salon ||
              "",
            service:
              booking.service ||
              "",
            date:
              booking.date ||
              "",
            time:
              booking.time ||
              "",
            lat:
              booking.lat ??
              booking.latitude,
            lng:
              booking.lng ??
              booking.longitude,
            address:
              booking.address ||
              "",
            raw:raw
          };
        }catch(error){
          console.warn(
            "Beautyslot prenotazione sessione:",
            error
          );
        }
      }

      return null;
    }

    async function loadBookings(){
      bookingsList.innerHTML=
        "";

      const {
        data:{user},
        error:userError
      }=
        await sb.auth.getUser();

      currentUser=
        user ||
        null;

      if(
        userError ||
        !currentUser
      ){
        const fallback=
          sessionFallbackBooking();

        if(fallback){
          bookingsList.appendChild(
            bookingCard(fallback)
          );
          emptyBox.style.display=
            "none";
        }else{
          emptyBox.textContent=
            "Accedi al tuo account per vedere le tue prenotazioni.";
          emptyBox.style.display=
            "block";
        }

        return;
      }

      const {
        data:rows,
        error
      }=
        await sb
          .from(
            "beautyslot_agenda"
          )
          .select(
            "id,professionista_user_id,data,ora_inizio,ora_fine,servizio_nome,servizi,stato,tema"
          )
          .eq(
            "cliente_user_id",
            currentUser.id
          )
          .eq(
            "tipo",
            "prenotazione"
          )
          .neq(
            "stato",
            "annullata"
          )
          .order(
            "data",
            {ascending:true}
          )
          .order(
            "ora_inizio",
            {ascending:true}
          );

      if(error){
        console.error(
          "Beautyslot mie prenotazioni:",
          error
        );

        const fallback=
          sessionFallbackBooking();

        if(fallback){
          bookingsList.appendChild(
            bookingCard(fallback)
          );
          emptyBox.style.display=
            "none";
        }else{
          emptyBox.textContent=
            "Non riesco a caricare le prenotazioni in questo momento.";
          emptyBox.style.display=
            "block";
        }

        return;
      }

      const themeRows=
        (rows || [])
          .filter(row=>{
            if(
              row.tema === "donna" ||
              row.tema === "uomo"
            ){
              return row.tema === tema;
            }

            // Per vecchie righe senza tema:
            // le mostriamo nella sezione corrente anziché perderle.
            return true;
          });

      if(!themeRows.length){
        const fallback=
          sessionFallbackBooking();

        if(fallback){
          bookingsList.appendChild(
            bookingCard(fallback)
          );
          emptyBox.style.display=
            "none";
        }else{
          emptyBox.style.display=
            "block";
        }

        return;
      }

      const professionalIds=
        [
          ...new Set(
            themeRows
              .map(
                row=>
                  row.professionista_user_id
              )
              .filter(Boolean)
          )
        ];

      const professionalsById=
        {};

      if(
        professionalIds.length
      ){
        const {
          data:professionals,
          error:professionalsError
        }=
          await sb
            .from(
              "beautyslot_professionisti"
            )
            .select(
              "user_id,nome_attivita,indirizzo,comune,provincia,latitude,longitude"
            )
            .in(
              "user_id",
              professionalIds
            );

        if(professionalsError){
          console.warn(
            "Dati saloni per prenotazioni:",
            professionalsError.message
          );
        }

        (
          professionals ||
          []
        ).forEach(item=>{
          professionalsById[
            item.user_id
          ]=
            item;
        });
      }

      themeRows.forEach(row=>{
        const professional=
          professionalsById[
            row.professionista_user_id
          ] ||
          {};

        const address=
          [
            professional.indirizzo,
            professional.comune,
            professional.provincia
          ]
            .filter(Boolean)
            .join(", ");

        const booking={
          id:row.id,
          source:"supabase",
          salon:
            professional.nome_attivita ||
            "Salone Beautyslot",
          service:
            row.servizio_nome ||
            "—",
          date:
            formatDate(
              row.data
            ),
          time:
            timeShort(
              row.ora_inizio
            ) +
            " – " +
            timeShort(
              row.ora_fine
            ),
          lat:
            professional.latitude,
          lng:
            professional.longitude,
          address:
            address
        };

        bookingsList.appendChild(
          bookingCard(
            booking
          )
        );
      });

      emptyBox.style.display=
        "none";
    }

    function subscribeBookingsRealtime(){
      if(!currentUser){
        return;
      }

      if(bookingsChannel){
        return;
      }

      bookingsChannel=
        sb
          .channel(
            "beautyslot-client-bookings-" +
            currentUser.id
          )
          .on(
            "postgres_changes",
            {
              event:"*",
              schema:"public",
              table:"beautyslot_agenda",
              filter:
                "cliente_user_id=eq." +
                currentUser.id
            },
            async ()=>{
              await loadBookings();
            }
          )
          .subscribe();
    }

    function removeMatchingSessionBooking(
      booking
    ){
      const themed=
        sessionStorage.getItem(
          bookingStorageKey
        );

      if(themed){
        try{
          const parsed=
            JSON.parse(themed);

          const sameSalon=
            !booking.salon ||
            !parsed.salon ||
            booking.salon ===
              parsed.salon;

          if(sameSalon){
            sessionStorage.removeItem(
              bookingStorageKey
            );
          }
        }catch(error){
          console.warn(error);
        }
      }

      const globalRaw=
        sessionStorage.getItem(
          "beautyslot_last_booking"
        );

      if(globalRaw){
        try{
          const parsed=
            JSON.parse(globalRaw);

          const sameSalon=
            !booking.salon ||
            !parsed.salon ||
            booking.salon ===
              parsed.salon;

          if(sameSalon){
            sessionStorage.removeItem(
              "beautyslot_last_booking"
            );
          }
        }catch(error){
          console.warn(error);
        }
      }
    }

    keepBookingButton.addEventListener(
      "click",
      ()=>{
        closeCancelModal();
      }
    );

    confirmCancelButton.addEventListener(
      "click",
      async ()=>{
        if(!activeBooking){
          closeCancelModal();
          return;
        }

        confirmCancelButton.disabled=
          true;

        const originalText=
          confirmCancelButton.textContent;

        confirmCancelButton.textContent=
          "Disdetta...";

        try{
          if(
            activeBooking.source === "supabase" &&
            activeBooking.id &&
            currentUser
          ){
            const {
              data:cancelled,
              error
            }=
              await sb.rpc(
                "beautyslot_annulla_prenotazione_cliente",
                {
                  p_booking_id:
                    String(activeBooking.id)
                }
              );

            if(error){
              throw error;
            }

            if(cancelled !== true){
              throw new Error(
                "La prenotazione non è stata annullata. Controlla che appartenga all'account attualmente collegato."
              );
            }
          }

          removeMatchingSessionBooking(
            activeBooking
          );

          closeCancelModal();

          await loadBookings();

        }catch(error){
          console.error(
            "Disdetta prenotazione:",
            error
          );

          alert(
            "Non sono riuscito a disdire l'appuntamento. " +
            (error?.message || "Riprova.")
          );
        }finally{
          confirmCancelButton.disabled=
            false;

          confirmCancelButton.textContent=
            originalText;
        }
      }
    );

    cancelModal.addEventListener(
      "click",
      event=>{
        if(
          event.target ===
          cancelModal
        ){
          closeCancelModal();
        }
      }
    );

    document.addEventListener(
      "keydown",
      event=>{
        if(
          event.key ===
            "Escape" &&
          cancelModal.classList.contains(
            "open"
          )
        ){
          closeCancelModal();
        }
      }
    );

    async function initBookingsPage(){
      await loadBookings();
      subscribeBookingsRealtime();
    }

    window.addEventListener(
      "beforeunload",
      ()=>{
        if(bookingsChannel){
          sb.removeChannel(
            bookingsChannel
          );
        }
      }
    );

    initBookingsPage();
  </script>
</body>
</html>
