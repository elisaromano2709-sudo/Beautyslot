<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautyslot — Il mio profilo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f7ecec; --bg2:#f1e1e3; --accent:#bb8188; --accent-dark:#9d6870;
      --text:#554d4e; --muted:#8f8386; --line:rgba(157,104,112,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Helvetica Neue",Arial,sans-serif}
    body{
      min-height:100vh;color:var(--text);
      background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.75),transparent 34%),linear-gradient(180deg,var(--bg),var(--bg2));
    }
    body.uomo{
      --bg:#eef5fa; --bg2:#e7f0f7; --accent:#86abc7; --accent-dark:#5f87a5;
      --text:#4b5e69; --muted:#7f8d98; --line:rgba(95,135,165,.18);
    }
    .topbar{
      position:sticky;top:0;z-index:20;display:grid;grid-template-columns:52px 1fr 52px;
      align-items:center;padding:13px 16px;background:rgba(255,255,255,.45);
      backdrop-filter:blur(14px);border-bottom:1px solid var(--line)
    }
    .back{width:44px;height:44px;border:0;background:transparent;color:var(--text);font-size:24px;cursor:pointer}
    .brand{text-align:center}
    .brand-name{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;color:var(--accent-dark)}
    .brand-tag{margin-top:5px;font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
    .page{width:min(760px,calc(100% - 28px));margin:28px auto 50px}
    .profile-card{overflow:hidden;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.76);box-shadow:0 24px 65px rgba(70,50,55,.08)}
    .profile-head{padding:34px 28px 28px;text-align:center;border-bottom:1px solid var(--line)}
    .avatar{width:82px;height:82px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.62);border:1px solid var(--line);color:var(--accent-dark)}
    .avatar svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .eyebrow{margin-bottom:8px;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;color:var(--accent-dark)}
    .profile-body{padding:28px}
    .info-grid{display:grid;gap:14px}
    .info-box,.section{padding:18px 19px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.48)}
    .label{margin-bottom:7px;font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
    .value{font-size:15px;line-height:1.5;color:var(--text);word-break:break-word}
    .section{margin-top:22px;padding:22px;border-radius:21px}
    .section-title{margin:0 0 7px;font-family:Georgia,"Times New Roman",serif;font-size:23px;font-weight:400;color:var(--accent-dark)}
    .section-text{margin:0 0 17px;font-size:12px;line-height:1.55;color:var(--muted)}
    .field{margin-top:12px}
    .field label{display:block;margin-bottom:7px;font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
    .field input{width:100%;min-height:48px;padding:0 15px;border:1px solid var(--line);border-radius:14px;outline:none;background:#fff;color:var(--text);font:inherit}
    .button{width:100%;min-height:50px;margin-top:16px;border:1px solid transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
    .button.primary{background:var(--accent-dark);color:#fff}
    .button.secondary{background:#fff;border-color:var(--line);color:var(--accent-dark)}

    .forgot-link{
      display:inline-flex;
      margin:0;
      padding:0;
      border:0;
      background:transparent;
      color:var(--accent-dark);
      cursor:pointer;
      font-family:Georgia,"Times New Roman",serif;
      font-size:21px;
      font-weight:400;
      line-height:1.3;
      text-decoration:none;
    }

    .forgot-link:hover{
      opacity:.78;
    }

    .recovery-box{
      display:none;
      margin-top:18px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:17px;
      background:rgba(255,255,255,.50);
    }

    .recovery-box.open{
      display:block;
    }

    .recovery-title{
      margin:0 0 6px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:20px;
      font-weight:400;
      color:var(--accent-dark);
    }

    .recovery-text{
      margin:0 0 14px;
      font-size:12px;
      line-height:1.55;
      color:var(--muted);
    }

    .code-row{
      display:none;
      margin-top:14px;
    }

    .code-row.open{
      display:block;
    }

    .code-input{
      text-align:center;
      letter-spacing:7px;
      font-size:20px !important;
      font-weight:600;
    }

    .verified-box{
      display:none;
      margin-top:14px;
    }

    .verified-box.open{
      display:block;
    }

    .small-button{
      min-height:46px;
      margin-top:12px;
    }

    .message{display:none;margin-top:12px;padding:12px 14px;border-radius:13px;font-size:12px;line-height:1.5}
    .message.ok{display:block;background:rgba(102,153,122,.10);color:#52715e}
    .message.error{display:block;background:rgba(160,89,96,.10);color:#86545a}
    @media(max-width:560px){
      .page{width:calc(100% - 18px);margin-top:14px}
      .profile-card{border-radius:23px}
      .profile-head{padding:28px 20px 24px}
      .profile-body{padding:20px}
      h1{font-size:33px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="back" id="backButton" aria-label="Torna indietro">←</button>
    <div class="brand">
      <h2 class="brand-name">Beautyslot</h2>
      <div class="brand-tag">Book beauty. Your way.</div>
    </div>
    <div></div>
  </header>

  <main class="page">
    <section class="profile-card">
      <div id="profileContent" hidden>
        <div class="profile-head">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.4"></circle>
              <path d="M5.4 19c.8-4.1 3-6.2 6.6-6.2s5.8 2.1 6.6 6.2"></path>
            </svg>
          </div>
          <div class="eyebrow">Il mio profilo</div>
          <h1 id="profileTitle">Ciao</h1>
        </div>

        <div class="profile-body">
          <div class="info-grid">
            <div class="info-box">
              <div class="label">Nome</div>
              <div class="value" id="profileName">—</div>
            </div>
            <div class="info-box">
              <div class="label">Email</div>
              <div class="value" id="profileEmail">—</div>
            </div>
            <div class="info-box">
              <div class="label">Password</div>
              <div class="value">••••••••••••</div>
            </div>
          </div>

          <section class="section">
            <button class="forgot-link" type="button" id="forgotPassword">
              Password dimenticata?
            </button>

            <div class="recovery-box" id="recoveryBox">
              <h3 class="recovery-title">Recupera la password</h3>

              <p class="recovery-text" id="recoveryEmailText">
                Ti invieremo un codice di verifica all'indirizzo email associato al tuo account.
              </p>

              <button class="button secondary small-button" type="button" id="sendRecoveryCode">
                Invia codice via email
              </button>

              <div class="message" id="sendCodeMessage"></div>

              <div class="code-row" id="codeRow">
                <div class="field">
                  <label for="recoveryCode">Codice ricevuto via email</label>
                  <input
                    class="code-input"
                    id="recoveryCode"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    minlength="6"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="000000"
                  >
                </div>

                <button class="button secondary small-button" type="button" id="verifyRecoveryCode">
                  Verifica codice
                </button>

                <div class="message" id="verifyCodeMessage"></div>
              </div>

              <div class="verified-box" id="verifiedBox">
                <div class="field">
                  <label for="recoveryPassword">Nuova password</label>
                  <input
                    id="recoveryPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="6"
                    placeholder="Nuova password"
                  >
                </div>

                <div class="field">
                  <label for="recoveryPasswordConfirm">Conferma nuova password</label>
                  <input
                    id="recoveryPasswordConfirm"
                    type="password"
                    autocomplete="new-password"
                    minlength="6"
                    placeholder="Ripeti la nuova password"
                  >
                </div>

                <button class="button primary" type="button" id="saveRecoveryPassword">
                  Aggiorna password
                </button>

                <div class="message" id="recoveryPasswordMessage"></div>
              </div>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">Cambia account</h2>
            <p class="section-text">Esci da questo profilo e accedi con un altro account Beautyslot.</p>
            <button class="button secondary" type="button" id="changeAccount">Cambia account</button>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://kfhjydwgjtiyjdkedvrp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BueoI4fhTcQCdkaGnrtk9g_A0cJRkh7";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const params = new URLSearchParams(window.location.search);
    const tema = params.get("tema") === "uomo" ? "uomo" : "donna";
    let currentUserEmail = "";
    let recoveryEmail = "";
    let recoveryRequestInProgress = false;
    if(tema === "uomo") document.body.classList.add("uomo");

    document.getElementById("backButton").addEventListener("click", () => {
      window.location.href = tema === "uomo" ? "uomo.html" : "donna.html";
    });

    function capitalize(value){
      const clean = (value || "").trim();
      return clean ? clean.charAt(0).toUpperCase() + clean.slice(1) : "";
    }

    function getNameFromUser(user){
      const metadata = user?.user_metadata || {};

      /*
        Il profilo NON usa più il nome salvato da un account precedente.
        La fonte principale è sempre l'utente Supabase autenticato.
      */
      let nome =
        metadata.nome ||
        (metadata.full_name ? metadata.full_name.trim().split(/\s+/)[0] : "");

      if(!nome && user?.email){
        const prefix = user.email.split("@")[0];
        nome = prefix.split(/[._-]/)[0].replace(/[^a-zA-ZÀ-ÿ]/g,"");
      }

      return capitalize(nome);
    }

    function clearStoredIdentity(){
      localStorage.removeItem("beautyslot_nome");
      localStorage.removeItem("beautyslot_cognome");
      localStorage.removeItem("beautyslot_full_name");
      localStorage.removeItem("beautyslot_user_id");
      localStorage.removeItem("beautyslot_email");
    }

    async function loadProfile(){
      const { data, error } = await client.auth.getUser();

      if(error || !data?.user){
        window.location.href = "login.html";
        return;
      }

      const user = data.user;

      /*
        Se il browser conserva dati appartenenti a un altro user.id,
        li eliminiamo prima di mostrare qualsiasi informazione.
      */
      const storedUserId = localStorage.getItem("beautyslot_user_id");
      if(storedUserId && storedUserId !== user.id){
        clearStoredIdentity();
      }

      const metadata = user.user_metadata || {};
      const nome = getNameFromUser(user);
      const cognome = (metadata.cognome || "").trim();
      const fullName = (metadata.full_name || "").trim() || [nome,cognome].filter(Boolean).join(" ");

      document.getElementById("profileTitle").textContent = nome ? "Ciao " + nome : "Il mio profilo";
      document.getElementById("profileName").textContent = fullName || nome || "—";
      currentUserEmail = user.email || "";
      recoveryEmail = currentUserEmail;
      document.getElementById("profileEmail").textContent = currentUserEmail || "—";

      const recoveryEmailText = document.getElementById("recoveryEmailText");
      if(currentUserEmail){
        recoveryEmailText.textContent =
          "Ti invieremo un codice di verifica a " + currentUserEmail + ".";
      }

      localStorage.setItem("beautyslot_user_id", user.id || "");
      localStorage.setItem("beautyslot_email", currentUserEmail);
      if(nome) localStorage.setItem("beautyslot_nome", nome);
      if(cognome) localStorage.setItem("beautyslot_cognome", cognome);
      if(fullName) localStorage.setItem("beautyslot_full_name", fullName);

      document.getElementById("profileContent").hidden = false;
    }


    const forgotPassword = document.getElementById("forgotPassword");
    const recoveryBox = document.getElementById("recoveryBox");
    const sendRecoveryCode = document.getElementById("sendRecoveryCode");
    const sendCodeMessage = document.getElementById("sendCodeMessage");
    const codeRow = document.getElementById("codeRow");
    const verifyRecoveryCode = document.getElementById("verifyRecoveryCode");
    const verifyCodeMessage = document.getElementById("verifyCodeMessage");
    const verifiedBox = document.getElementById("verifiedBox");
    const saveRecoveryPassword = document.getElementById("saveRecoveryPassword");
    const recoveryPasswordMessage = document.getElementById("recoveryPasswordMessage");

    const recoveryCodeInput = document.getElementById("recoveryCode");

    recoveryCodeInput.addEventListener("input", () => {
      recoveryCodeInput.value = recoveryCodeInput.value
        .replace(/\D/g, "")
        .slice(0, 6);
    });

    forgotPassword.addEventListener("click", () => {
      recoveryBox.classList.toggle("open");

      if(recoveryBox.classList.contains("open")){
        recoveryBox.scrollIntoView({ behavior:"smooth", block:"nearest" });
      }
    });

    sendRecoveryCode.addEventListener("click", async () => {
      if(recoveryRequestInProgress) return;

      sendCodeMessage.className = "message";
      sendCodeMessage.textContent = "";

      recoveryEmail = (currentUserEmail || recoveryEmail || "").trim().toLowerCase();

      if(!recoveryEmail){
        sendCodeMessage.className = "message error";
        sendCodeMessage.textContent = "Non è stato possibile recuperare l'indirizzo email dell'account.";
        return;
      }

      verifiedBox.classList.remove("open");
      codeRow.classList.remove("open");
      recoveryCodeInput.value = "";
      document.getElementById("recoveryPassword").value = "";
      document.getElementById("recoveryPasswordConfirm").value = "";
      verifyCodeMessage.className = "message";
      verifyCodeMessage.textContent = "";
      recoveryPasswordMessage.className = "message";
      recoveryPasswordMessage.textContent = "";

      recoveryRequestInProgress = true;
      sendRecoveryCode.disabled = true;
      sendRecoveryCode.textContent = "Invio in corso…";

      try{
        /*
          Il recovery password deve creare una NUOVA sessione di recupero.
          Prima eliminiamo la vecchia sessione locale del browser, conservando
          l'email in recoveryEmail.
        */
        await client.auth.signOut({ scope:"local" });

        localStorage.removeItem("beautyslot_nome");
        localStorage.removeItem("beautyslot_cognome");
        localStorage.removeItem("beautyslot_full_name");
        localStorage.removeItem("beautyslot_user_id");
        localStorage.removeItem("beautyslot_email");

        const recoveryRedirect = new URL(
          "profilo.html?tema=" + encodeURIComponent(tema),
          window.location.href
        ).href;

        const { error } = await client.auth.resetPasswordForEmail(
          recoveryEmail,
          {
            redirectTo: recoveryRedirect
          }
        );

        if(error) throw error;

        /*
          Manteniamo l'email solo nella sessione della scheda corrente:
          serve per verificare il codice ricevuto senza riutilizzare dati
          di un vecchio account.
        */
        sessionStorage.setItem("beautyslot_recovery_email", recoveryEmail);

        sendCodeMessage.className = "message ok";
        sendCodeMessage.textContent =
          "Codice di verifica inviato a " + recoveryEmail + ". Usa l'ultimo codice ricevuto.";

        codeRow.classList.add("open");
        recoveryCodeInput.focus();

      }catch(error){
        console.error("Beautyslot recovery request:", error);

        sendCodeMessage.className = "message error";
        sendCodeMessage.textContent =
          "Non è stato possibile inviare il codice. " +
          (error?.message || "Riprova.");
      }finally{
        recoveryRequestInProgress = false;
        sendRecoveryCode.disabled = false;
        sendRecoveryCode.textContent = "Invia di nuovo il codice";
      }
    });


    verifyRecoveryCode.addEventListener("click", async () => {
      const code = recoveryCodeInput.value.trim();
      const emailForRecovery =
        (recoveryEmail ||
         sessionStorage.getItem("beautyslot_recovery_email") ||
         currentUserEmail ||
         "").trim().toLowerCase();

      verifyCodeMessage.className = "message";
      verifyCodeMessage.textContent = "";

      if(!emailForRecovery){
        verifyCodeMessage.className = "message error";
        verifyCodeMessage.textContent =
          "Email di recupero non disponibile. Richiedi nuovamente il codice.";
        return;
      }

      if(!/^\d{6}$/.test(code)){
        verifyCodeMessage.className = "message error";
        verifyCodeMessage.textContent =
          "Inserisci esattamente le 6 cifre ricevute nell'ultima email Beautyslot.";
        return;
      }

      verifyRecoveryCode.disabled = true;
      verifyRecoveryCode.textContent = "Verifica in corso…";

      try{
        const { data, error } = await client.auth.verifyOtp({
          email: emailForRecovery,
          token: code,
          type: "recovery"
        });

        if(error) throw error;

        /*
          verifyOtp(recovery) deve restituire una sessione valida.
          Senza questa sessione updateUser non potrebbe cambiare la password.
        */
        if(!data?.session || !data?.user){
          throw new Error("Supabase non ha creato la sessione di recupero.");
        }

        recoveryEmail = data.user.email || emailForRecovery;
        currentUserEmail = recoveryEmail;

        verifyCodeMessage.className = "message ok";
        verifyCodeMessage.textContent =
          "Codice verificato. Ora puoi scegliere una nuova password.";

        verifiedBox.classList.add("open");
        document.getElementById("recoveryPassword").focus();

      }catch(error){
        console.error("Beautyslot verify recovery OTP:", error);

        const detail =
          error?.code ||
          error?.message ||
          "Codice non valido o scaduto.";

        verifyCodeMessage.className = "message error";
        verifyCodeMessage.textContent =
          "Il codice non è stato accettato: " + detail +
          " Usa l'ultimo codice ricevuto oppure richiedine uno nuovo.";
      }finally{
        verifyRecoveryCode.disabled = false;
        verifyRecoveryCode.textContent = "Verifica codice";
      }
    });


    saveRecoveryPassword.addEventListener("click", async () => {
      const password = document.getElementById("recoveryPassword").value;
      const confirm = document.getElementById("recoveryPasswordConfirm").value;

      recoveryPasswordMessage.className = "message";
      recoveryPasswordMessage.textContent = "";

      if(password.length < 6){
        recoveryPasswordMessage.className = "message error";
        recoveryPasswordMessage.textContent = "La nuova password deve contenere almeno 6 caratteri.";
        return;
      }

      if(password !== confirm){
        recoveryPasswordMessage.className = "message error";
        recoveryPasswordMessage.textContent = "Le due password non coincidono.";
        return;
      }

      saveRecoveryPassword.disabled = true;
      saveRecoveryPassword.textContent = "Aggiornamento…";

      const { error } = await client.auth.updateUser({
        password: password
      });

      saveRecoveryPassword.disabled = false;
      saveRecoveryPassword.textContent = "Aggiorna password";

      if(error){
        recoveryPasswordMessage.className = "message error";
        recoveryPasswordMessage.textContent =
          "Non è stato possibile aggiornare la password. " + error.message;
        return;
      }

      document.getElementById("recoveryPassword").value = "";
      document.getElementById("recoveryPasswordConfirm").value = "";
      recoveryCodeInput.value = "";

      sessionStorage.removeItem("beautyslot_recovery_email");

      const { data: refreshedUserData } = await client.auth.getUser();
      const refreshedUser = refreshedUserData?.user;

      if(refreshedUser){
        const refreshedMetadata = refreshedUser.user_metadata || {};
        const refreshedName =
          refreshedMetadata.nome ||
          (refreshedMetadata.full_name
            ? refreshedMetadata.full_name.trim().split(/\s+/)[0]
            : "");

        localStorage.setItem("beautyslot_user_id", refreshedUser.id || "");
        localStorage.setItem("beautyslot_email", refreshedUser.email || recoveryEmail || "");

        if(refreshedName){
          localStorage.setItem("beautyslot_nome", refreshedName);
        }
        if(refreshedMetadata.cognome){
          localStorage.setItem("beautyslot_cognome", refreshedMetadata.cognome);
        }
        if(refreshedMetadata.full_name){
          localStorage.setItem("beautyslot_full_name", refreshedMetadata.full_name);
        }
      }

      recoveryPasswordMessage.className = "message ok";
      recoveryPasswordMessage.textContent =
        "Password aggiornata correttamente. Ora puoi usare la nuova password.";
    });

    document.getElementById("changeAccount").addEventListener("click", async () => {
      await client.auth.signOut();
      localStorage.removeItem("beautyslot_nome");
      localStorage.removeItem("beautyslot_cognome");
      localStorage.removeItem("beautyslot_full_name");
      window.location.href = "login.html";
    });

    loadProfile();
  </script>
</body>
</html>
